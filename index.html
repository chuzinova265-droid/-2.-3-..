<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Словарный диктант · интерактивные часы</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #d9c8a9;
            min-height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            overflow: hidden;
            position: relative;
        }
        .scene-wrapper {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            width: calc(30% + 405px);
            height: 100vh;
            margin-left: 0;
            flex-shrink: 0;
            position: relative;
            background: #d9c8a9;
            border: none;
        }
        .svg-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #d9c8a9;
            position: relative;
            border: none;
        }
        svg {
            display: block;
            width: 100%;
            height: 100%;
            background: transparent;
            border: none;
            outline: none;
        }
        .flower-emoji {
            font-size: 5em;
            line-height: 1;
            dominant-baseline: central;
            text-anchor: middle;
        }
        .desk-group {
            cursor: default;
        }
        #clock-overlay {
            position: absolute;
            left: 4.57%;
            top: 10%;
            width: 18%;
            aspect-ratio: 1 / 1;
            cursor: pointer;
            z-index: 20;
        }
        #time-question {
            position: absolute;
            top: calc(-35% + 6px);
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Segoe UI', sans-serif;
            font-weight: 900;
            font-size: clamp(12px, 1.8vw, 22px);
            color: #cc0000;
            text-shadow: 0 0 8px #ffaaaa;
            opacity: 0;
            transition: opacity 0.15s ease;
            white-space: nowrap;
            pointer-events: none;
            text-align: center;
        }
        #time-question.show {
            opacity: 1;
        }
        #clock-face {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #fcf8ed;
            border: max(3px, 0.6vw) solid #3d2b1b;
            box-shadow: 0 4px 4px #00000040;
            position: relative;
        }
        .clock-number {
            position: absolute;
            font-size: max(8px, 1vw);
            font-weight: bold;
            color: #1f2a1e;
            text-align: center;
            transform: translate(-50%, -50%);
        }
        .clock-hand {
            position: absolute;
            bottom: 50%;
            left: 50%;
            transform-origin: bottom center;
            border-radius: 2px;
        }
        .right-frame {
            position: absolute;
            top: 40px;
            bottom: 40px;
            right: 40px;
            width: calc(30% + 265px);
            height: calc(100vh - 80px);
            background-color: #fdfbf7;
            border-radius: 4px;
            border: 4px solid #8b6f4e;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .bottom-instruction {
            position: absolute;
            bottom: 24px;
            left: 0;
            width: 100%;
            text-align: center;
            color: #ffffff;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: clamp(16px, 2.2vw, 22px);
            letter-spacing: -0.5px;
            pointer-events: none;
            z-index: 15;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        }

        #starsCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            display: none;
        }
        .pages-container {
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 10;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .page {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 15px;
            animation: fadeIn 0.3s ease;
        }
        .page.active {
            display: flex;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .title-main {
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', cursive, sans-serif;
            font-size: clamp(1.8rem, 3vw, 2.5rem);
            color: #3e2723;
            text-align: center;
            margin-bottom: 10px;
        }
        .slogan-scarlet {
            font-family: 'Comic Sans MS', cursive;
            font-size: clamp(1.2rem, 2vw, 1.6rem);
            background: #fff8e1;
            padding: 12px 20px;
            border-radius: 30px;
            border: 3px dashed #8d6e63;
            color: #ff2400;
            font-weight: 900;
            text-align: center;
        }
        .mega-emoji {
            font-size: 16em;
            line-height: 0.9;
            text-align: center;
            display: block;
        }
        .input-field {
            width: 90%;
            max-width: 400px;
            padding: 15px;
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            font-family: 'Comic Sans MS', cursive;
            border: 3px solid #8d6e63;
            border-radius: 30px;
            background: #ffffff;
            text-align: center;
            outline: none;
            color: #3e2723;
        }
        .input-field:focus {
            border-color: #5d4037;
            box-shadow: 0 0 0 4px #d7ccc8;
        }
        .warning-msg {
            font-family: 'Comic Sans MS', cursive;
            font-size: 1rem;
            color: #c62828;
            text-align: center;
            min-height: 1.2em;
            margin-top: 5px;
        }
        .btn {
            font-family: 'Comic Sans MS', cursive;
            background: #81c784;
            border: 3px solid #388e3c;
            color: #1b5e20;
            font-size: clamp(1.2rem, 2vw, 1.5rem);
            font-weight: bold;
            padding: 12px 30px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2e7d32;
            transition: transform 0.1s, box-shadow 0.1s;
            margin-top: 10px;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #2e7d32;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 0 #2e7d32;
        }
        .counter {
            font-family: 'Comic Sans MS', cursive;
            font-size: clamp(1.3rem, 2.2vw, 1.8rem);
            background: #ffe0b2;
            padding: 10px 25px;
            border-radius: 20px;
            border: 2px solid #f57c00;
            color: #5d001e;
            font-weight: 900;
            margin-top: 0;
            margin-bottom: 20px;
        }
        .word-card {
            background: #ffffff;
            border: 3px solid #8d6e63;
            border-radius: 20px;
            padding: 20px;
            width: 95%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0,0,0,0.1);
        }
        .word-transcription {
            font-family: 'Arial', sans-serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: bold;
            color: #3e2723;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }
        .emoji-big {
            font-size: 4em;
            line-height: 1;
        }
        .answer-input {
            width: 100%;
            font-family: 'Arial', sans-serif;
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: bold;
            color: #00008b;
            padding: 12px;
            border: 3px solid #a1887f;
            border-radius: 15px;
            text-align: center;
            outline: none;
            resize: none;
            overflow: hidden;
            word-wrap: break-word;
            white-space: pre-wrap;
            min-height: 60px;
        }
        .answer-input:focus {
            border-color: #5d4037;
            box-shadow: 0 0 0 3px #d7ccc8;
        }
        .error-msg {
            font-family: 'Comic Sans MS', cursive;
            color: #c62828;
            font-weight: 900;
            font-size: clamp(1.4rem, 2.5vw, 1.8rem);
            margin-top: 15px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .error-msg.visible {
            opacity: 1;
        }
        .result-box {
            background: #fff8e1;
            border: 4px solid #ffb300;
            border-radius: 25px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
        }
        .grade {
            font-family: 'Comic Sans MS', cursive;
            font-size: clamp(2.5rem, 5vw, 4rem);
            color: #2e7d32;
            margin-bottom: 15px;
        }
        .feedback-scarlet {
            font-family: 'Comic Sans MS', cursive;
            font-size: clamp(1.8rem, 3.5vw, 2.8rem);
            color: #ff2400;
            font-weight: 900;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            line-height: 1.3;
        }

        @media (max-width: 1024px) {
            .scene-wrapper { width: 45%; }
            .right-frame { width: 50%; right: 20px; }
        }
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            .scene-wrapper { width: 100%; height: 50vh; }
            .right-frame { 
                position: relative; 
                width: 100%; 
                height: 50vh; 
                top: 0; bottom: 0; right: 0; 
                border-radius: 0;
                border-left: none; border-right: none; border-bottom: none;
            }
            .bottom-instruction { display: none; }
            .mega-emoji { font-size: 8em; }
        }
        @media (max-width: 480px) {
            .scene-wrapper { height: 40vh; }
            .right-frame { height: 60vh; }
            .pages-container { padding: 15px; }
            .word-card { padding: 15px; }
            .mega-emoji { font-size: 5em; }
        }
        @media (max-width: 360px) {
            .title-main { font-size: 1.5rem; }
            .slogan-scarlet { font-size: 1rem; padding: 8px 12px; }
            .word-transcription { font-size: 1.8rem; gap: 10px; }
            .emoji-big { font-size: 3em; }
            .mega-emoji { font-size: 4em; }
        }
        @media (min-width: 769px) and (max-height: 600px) {
            .scene-wrapper { height: 100vh; }
            .right-frame { height: calc(100vh - 40px); top: 20px; bottom: 20px; }
            .pages-container { justify-content: flex-start; padding-top: 10px; }
            .word-card { padding: 10px; margin: 5px 0; }
            .answer-input { min-height: 50px; font-size: 1.5rem; }
            .mega-emoji { font-size: 10em; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            body { flex-direction: row; }
            .scene-wrapper { width: 40%; height: 100vh; }
            .right-frame { width: 60%; height: 100vh; top: 0; bottom: 0; right: 0; }
            .word-transcription { font-size: 2rem; }
            .emoji-big { font-size: 3em; }
            .mega-emoji { font-size: 8em; }
        }
    </style>
</head>

                        <line x1="-16" y1="-20" x2="-16" y2="0" stroke="#4d3a25" stroke-width="2.5" stroke-linecap="round" />
                        <line x1="16" y1="-20" x2="16" y2="0" stroke="#4d3a25" stroke-width="2.5" stroke-linecap="round" />
                        <rect x="-16" y="0" width="32" height="8" rx="2" fill="#6b4f32" stroke="#4d3a25" stroke-width="1.5" />
                        <line x1="-14" y1="8" x2="-14" y2="13" stroke="#4d3a25" stroke-width="2.5" stroke-linecap="round" />
                        <line x1="14" y1="8" x2="14" y2="13" stroke="#4d3a25" stroke-width="2.5" stroke-linecap="round" />
                    </g>
                </g>
                <g class="desk-group" transform="translate(600, 330)">
                    <rect x="-40" y="-10" width="80" height="30" rx="4" fill="#b58b5a" stroke="#6f5437" stroke-width="2" />
                    <rect x="-44" y="-16" width="88" height="10" rx="4" fill="#dab07c" />
                    <rect x="-32" y="20" width="8" height="14" fill="#4d3a25" />
                    <rect x="24" y="20" width="8" height="14" fill="#4d3a25" />
                    <g transform="translate(0, 35)">
                        <rect x="-18" y="-20" width="36" height="4" rx="1" fill="#8b6f4e" stroke="#4d3a25" stroke-width="1" />
                        <rect x="-18" y="-12" width="36" height="4" rx="1" fill="#8b6f4e" stroke="#4d3a25" stroke-width="1" />
                        <line x1="-16" y1="-20" x2="-16" y2="0" stroke="#4d3a25" stroke-width="2.5" stroke-linecap="round" />
                        <line x1="16" y1="-20" x2="16" y2="0" stroke="#4d3a25" stroke-width="2.5" stroke-linecap="round" />
                        <rect x="-16" y="0" width="32" height="8" rx="2" fill="#6b4f32" stroke="#4d3a25" stroke-width="1.5" />
                        <line x1="-14" y1="8" x2="-14" y2="13" stroke="#4d3a25" stroke-width="2.5" stroke-linecap="round" />
                        <line x1="14" y1="8" x2="14" y2="13" stroke="#4d3a25" stroke-width="2.5" stroke-linecap="round" />
                    </g>
                </g>
                <text x="40" y="360" font-size="5em" class="flower-emoji">🪴</text>
                <text x="660" y="360" font-size="5em" class="flower-emoji">🪴</text>
            </svg>

            <div id="clock-overlay">
                <div id="time-question">Который час?</div>
                <div id="clock-face">
                    <div class="clock-number" style="top: 8%; left: 50%;">12</div>
                    <div class="clock-number" style="top: 13.6%; left: 71%;">1</div>
                    <div class="clock-number" style="top: 29%; left: 86.4%;">2</div>
                    <div class="clock-number" style="top: 50%; left: 92%;">3</div>
                    <div class="clock-number" style="top: 71%; left: 86.4%;">4</div>
                    <div class="clock-number" style="top: 86.4%; left: 71%;">5</div>
                    <div class="clock-number" style="top: 92%; left: 50%;">6</div>
                    <div class="clock-number" style="top: 86.4%; left: 29%;">7</div>
                    <div class="clock-number" style="top: 71%; left: 13.6%;">8</div>
                    <div class="clock-number" style="top: 50%; left: 8%;">9</div>
                    <div class="clock-number" style="top: 29%; left: 13.6%;">10</div>
                    <div class="clock-number" style="top: 13.6%; left: 29%;">11</div>
                    
                    <div id="hour-hand" class="clock-hand" style="width: max(3px, 0.4vw); height: 30%; background: #2a3a2a; transform: translateX(-50%) rotate(30deg);"></div>
                    <div id="minute-hand" class="clock-hand" style="width: max(2px, 0.3vw); height: 45%; background: #3d3d3d; transform: translateX(-50%) rotate(120deg);"></div>
                    <div id="second-hand" class="clock-hand" style="width: max(1px, 0.15vw); height: 50%; background: #b33e3e; transform: translateX(-50%) rotate(200deg);"></div>
                    
                    <div style="position: absolute; top: 50%; left: 50%; width: max(6px, 0.8vw); height: max(6px, 0.8vw); background: #1f2a1e; border: max(1px, 0.15vw) solid #fcf8ed; border-radius: 50%; transform: translate(-50%, -50%);"></div>
                </div>
            </div>
            
            <div class="bottom-instruction">Нажми на часы и ответь на вопрос.</div>
        </div>
    </div>

    <div class="right-frame">
        <canvas id="starsCanvas"></canvas>
        <main class="pages-container" id="pagesContainer" role="main" aria-label="Словарный диктант">
        </main>
    </div>

    <script>
        (function() {
            const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx3_gkdieykO_DkzMSvHBbfQZA1t-EtdtsdNoX2_RawKCdg7TY-AYKvA9cLIi_E2rBoeA/exec';

            const words = [
                { transcription: "[апт'эка]", correct: 'аптека', emoji: '👩‍⚕️' },
                { transcription: '[завот]', correct: 'завод', emoji: '🏭' },
                { transcription: '[багаш]', correct: 'багаж', emoji: '🧳' },
                { transcription: "[каст'ор]", correct: 'костёр', emoji: '🔥' },
                { transcription: "[б'ис'эда]", correct: 'беседа', emoji: '🧑🏻‍💻' },
                { transcription: "[вмэс'т'э]", correct: 'вместе', emoji: '🫂' },
                { transcription: '[гарох]', correct: 'горох', emoji: '🫛' },
                { transcription: '[запат]', correct: 'запад', emoji: '🧭' },
                { transcription: '[забота]', correct: 'забота', emoji: '🤱🏻' },
                { transcription: "[инжын'эр]", correct: 'инженер', emoji: '🧑‍🔧' },
                { transcription: "[кастр'ул'а]", correct: 'кастрюля', emoji: '🍲' },
                { transcription: "[картоф'ил']", correct: 'картофель', emoji: '🥔' },
                { transcription: "[кан'эшна]", correct: 'конечно', emoji: '👍' },
                { transcription: "[лаг'ир']", correct: 'лагерь', emoji: '🏕️' },
                { transcription: '[група]', correct: 'группа', emoji: '👨‍👩‍👧‍👦' }
            ];

            let currentPage = 0;
            let studentName = '';
            let results = new Array(15).fill(null);
            let correctCount = 0;
            let totalWords = words.length;
            let dataSent = false;
            let nameWarningShown = false;

            const container = document.getElementById('pagesContainer');
            const canvas = document.getElementById('starsCanvas');
            const rightFrame = document.querySelector('.right-frame');
            let ctx = canvas.getContext('2d');

            function buildPages() {
                container.innerHTML = '';

                const page0 = document.createElement('section');
                page0.className = 'page active';
                page0.id = 'page0';
                page0.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; width:100%; height: 100%; justify-content: space-between; padding: 10px 0;">
                        <div>
                            <h1 class="title-main">Словарный диктант</h1>
                            <div class="slogan-scarlet">🎈 Ошибкам — бой, словарь — со мной!</div>
                        </div>
                        <div style="display:flex; flex-direction:column; align-items:center; width:100%; flex-grow: 1; justify-content: center; gap: 10px;">
                            <input type="text" id="studentNameInput" class="input-field" placeholder="Фамилия, имя" autocomplete="off" aria-label="Введите фамилию и имя">
                            <div id="nameWarning" class="warning-msg" role="alert"></div>
                            <button class="btn" id="startBtn">▶ Начать словарный диктант</button>
                        </div>
                        <div class="mega-emoji">🧑🏼‍🎓👩🏻‍🎓</div>
                    </div>
                `;
                container.appendChild(page0);

                for (let i = 0; i < totalWords; i++) {
                    const word = words[i];
                    const page = document.createElement('section');
                    page.className = 'page';
                    page.id = `page${i+1}`;
                    page.setAttribute('data-word-index', i);
                    page.setAttribute('role', 'form');
                    page.setAttribute('aria-label', `Слово ${i+1} из 15`);
                    page.innerHTML = `
                        <output class="counter" id="counter-${i+1}" aria-live="polite">Правильных ответов 0 из 15</output>
                        <div class="word-card">
                            <div class="word-transcription">
                                <span class="emoji-big" aria-hidden="true">${word.emoji}</span>
                                <span>${word.transcription}</span>
                            </div>
                            <textarea class="answer-input" id="answer-${i+1}" placeholder="напиши слово..." autocomplete="off" rows="1" aria-label="Поле для ввода слова"></textarea>
                            <div id="error-${i+1}" class="error-msg" role="alert">Ошибка! Надо выучить слово!</div>
                            <button class="btn next-btn" id="next-${i+1}" data-index="${i}" style="display:none;" aria-label="Проверить и перейти к следующему слову">Проверить</button>
                        </div>
                    `;
                    container.appendChild(page);
                }

                const pageResult = document.createElement('section');
                pageResult.className = 'page';
                pageResult.id = 'page16';
                pageResult.setAttribute('role', 'status');
                pageResult.setAttribute('aria-live', 'polite');
                pageResult.innerHTML = `
                    <div style="display:flex; flex-direction:column; align-items:center; width:100%; height: 100%; justify-content: space-between; padding: 10px 0;">
                        <output class="counter" id="counter-16" aria-live="polite">Правильных ответов 0 из 15</output>
                        <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                            <div class="result-box">
                                <div class="grade" id="finalGrade"></div>
                                <div class="feedback-scarlet" id="finalFeedback"></div>
                            </div>
                        </div>
                        <div class="mega-emoji">🧑🏼‍🎓👩🏻‍🎓</div>
                    </div>
                `;
                container.appendChild(pageResult);
            }

            function updateCounterOnPage(pageId) {
                const counterSpan = document.getElementById(`counter-${pageId}`);
                if (counterSpan) {
                    counterSpan.innerText = `Правильных ответов ${correctCount} из ${totalWords}`;
                }
            }

            function goToPage(pageIndex) {
                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                const nextPage = document.getElementById(`page${pageIndex}`);
                if (nextPage) {
                    nextPage.classList.add('active');
                    currentPage = pageIndex;

                    if (pageIndex === 16) {
                        showResultAndSend();
                    } else if (pageIndex >= 1 && pageIndex <= 15) {
                        setTimeout(() => {
                            const inp = document.getElementById(`answer-${pageIndex}`);
                            if (inp) {
                                inp.focus();
                                inp.addEventListener('input', function() {
                                    this.style.height = 'auto';
                                    this.style.height = (this.scrollHeight) + 'px';
                                    const btn = document.getElementById(`next-${pageIndex}`);
                                    if (this.value.trim().length > 0 && btn) {
                                        btn.style.display = 'inline-block';
                                    } else if (btn) {
                                        btn.style.display = 'none';
                                    }
                                });
                            }
                        }, 100);
                        updateCounterOnPage(pageIndex);
                    }
                }
            }

            function handleStart() {
                const nameInput = document.getElementById('studentNameInput');
                const warningEl = document.getElementById('nameWarning');
                let name = nameInput.value.trim();

                if (name === '') {
                    warningEl.innerText = 'Пожалуйста, представься: напиши фамилию и имя.';
                    return;
                }

                const nameParts = name.split(/\s+/);
                if (nameParts.length === 1) {
                    if (!nameWarningShown) {
                        warningEl.innerText = 'Пожалуйста, введите Фамилию и Имя. (Если введена только фамилия, нажмите ещё раз для продолжения)';
                        nameWarningShown = true;
                        return;
                    }
                }

                studentName = name;
                results.fill(null);
                correctCount = 0;
                dataSent = false;
                goToPage(1);
            }

            function playWinSound() {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if (!AudioContext) return;
                    const actx = new AudioContext();
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const osc = actx.createOscillator();
                        const gain = actx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = freq;
                        osc.connect(gain);
                        gain.connect(actx.destination);
                        const startTime = actx.currentTime + i * 0.1;
                        gain.gain.setValueAtTime(0, startTime);
                        gain.gain.linearRampToValueAtTime(0.3, startTime + 0.05);
                        gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.4);
                        osc.start(startTime);
                        osc.stop(startTime + 0.5);
                    });
                    setTimeout(() => {
                        [523.25, 659.25, 783.99].forEach(freq => {
                            const osc = actx.createOscillator();
                            const gain = actx.createGain();
                            osc.type = 'triangle';
                            osc.frequency.value = freq;
                            osc.connect(gain);
                            gain.connect(actx.destination);
                            gain.gain.setValueAtTime(0.2, actx.currentTime);
                            gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + 1.0);
                            osc.start();
                            osc.stop(actx.currentTime + 1.0);
                        });
                    }, 400);
                } catch (e) {
                    console.warn('Audio play failed', e);
                }
            }

            function handleNext(wordIndex) {
                const pageId = wordIndex + 1;
                const inputField = document.getElementById(`answer-${pageId}`);
                const errorEl = document.getElementById(`error-${pageId}`);
                const answer = inputField.value.trim();

                if (answer === '') {
                    return;
                }

                if (results[wordIndex] === null) {
                    const isCorrect = answer.toLowerCase() === words[wordIndex].correct.toLowerCase();
                    results[wordIndex] = isCorrect;
                    if (isCorrect) {
                        correctCount++;
                        playWinSound();
                    } else {
                        errorEl.classList.add('visible');
                        setTimeout(() => {
                            errorEl.classList.remove('visible');
                            moveToNext(wordIndex);
                        }, 1500);
                        return; 
                    }
                }
                moveToNext(wordIndex);
            }

            function moveToNext(wordIndex) {
                document.querySelectorAll('.counter').forEach(el => {
                    el.innerText = `Правильных ответов ${correctCount} из ${totalWords}`;
                });

                if (wordIndex + 1 < totalWords) {
                    goToPage(wordIndex + 2);
                } else {
                    goToPage(16);
                }
            }

            function showResultAndSend() {
                const finalCounter = document.getElementById('counter-16');
                if (finalCounter) {
                    finalCounter.innerText = `Правильных ответов ${correctCount} из ${totalWords}`;
                }

                let grade = 2;
                if (correctCount === 15) {
                    grade = 5;
                } else if (correctCount >= 12) {
                    grade = 4;
                } else if (correctCount >= 8) {
                    grade = 3;
                } else {
                    grade = 2;
                }

                const gradeElement = document.getElementById('finalGrade');
                const feedbackElement = document.getElementById('finalFeedback');

                let gradeText = '';
                let feedbackText = '';

                switch(grade) {
                    case 5:
                        gradeText = 'Оценка: 5!';
                        feedbackText = 'Умничка! Так держать!';
                        break;
                    case 4:
                        gradeText = 'Оценка: 4!';
                        feedbackText = 'Хорошо! Но ты можешь лучше!';
                        break;
                    case 3:
                        gradeText = 'Оценка: 3';
                        feedbackText = 'Повторяй словарные слова и тогда тебя ждёт успех!';
                        break;
                    default:
                        gradeText = 'Оценка: 2';
                        feedbackText = 'Не ленись! Заставь себя выучить словарные слова!';
                }

                gradeElement.innerText = gradeText;
                feedbackElement.innerText = feedbackText;

                startStars();

                if (!dataSent && studentName) {
                    sendToGoogleSheet(studentName, correctCount, totalWords, totalWords - correctCount, grade);
                    dataSent = true;
                }
            }

            function sendToGoogleSheet(name, correct, total, errors, grade) {
                const payload = {
                    name: name,
                    correct: correct,
                    total: total,
                    errors: errors,
                    grade: grade
                };

                fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(payload)
                }).catch(err => console.warn('Send error (no-cors expected):', err));
            }

            let stars = [];
            let animationId = null;
            const STAR_COUNT = 80;

            function drawStar(ctx, cx, cy, spikes, outerRadius, innerRadius, color) {
                let rot = Math.PI / 2 * 3;
                let x = cx;
                let y = cy;
                let step = Math.PI / spikes;
                ctx.beginPath();
                ctx.moveTo(cx, cy - outerRadius);
                for (let i = 0; i < spikes; i++) {
                    x = cx + Math.cos(rot) * outerRadius;
                    y = cy + Math.sin(rot) * outerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                    x = cx + Math.cos(rot) * innerRadius;
                    y = cy + Math.sin(rot) * innerRadius;
                    ctx.lineTo(x, y);
                    rot += step;
                }
                ctx.lineTo(cx, cy - outerRadius);
                ctx.closePath();
                ctx.fillStyle = color;
                ctx.fill();
            }

            function initStars() {
                stars = [];
                const w = rightFrame.clientWidth;
                const h = rightFrame.clientHeight;
                for (let i = 0; i < STAR_COUNT; i++) {
                    stars.push({
                        x: Math.random() * w,
                        y: Math.random() * h,
                        size: Math.random() * 4 + 2,
                        speedX: (Math.random() - 0.5) * 2.5,
                        speedY: (Math.random() - 0.5) * 2.5,
                        color: `hsl(${Math.random() * 360}, 100%, 65%)`
                    });
                }
            }

            function drawStars() {
                if (!ctx) return;
                const w = rightFrame.clientWidth;
                const h = rightFrame.clientHeight;
                if (canvas.width !== w || canvas.height !== h) {
                    canvas.width = w;
                    canvas.height = h;
                }
                ctx.clearRect(0, 0, w, h);
                ctx.shadowBlur = 6;
                ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                for (let s of stars) {
                    drawStar(ctx, s.x, s.y, 5, s.size, s.size / 2, s.color);
                    s.x += s.speedX;
                    s.y += s.speedY;

                    if (s.x < 0 || s.x > w) s.speedX *= -1;
                    if (s.y < 0 || s.y > h) s.speedY *= -1;

                    if (s.x < 0) s.x = 0;
                    if (s.x > w) s.x = w;
                    if (s.y < 0) s.y = 0;
                    if (s.y > h) s.y = h;
                }
                animationId = requestAnimationFrame(drawStars);
            }

            function startStars() {
                if (canvas.style.display === 'block') return;
                canvas.style.display = 'block';
                canvas.width = rightFrame.clientWidth;
                canvas.height = rightFrame.clientHeight;
                initStars();
                if (animationId) cancelAnimationFrame(animationId);
                animationId = requestAnimationFrame(drawStars);
            }

            function stopStars() {
                if (animationId) {
                    cancelAnimationFrame(animationId);
                    animationId = null;
                }
                canvas.style.display = 'none';
                if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            function attachEvents() {
                document.getElementById('startBtn').addEventListener('click', handleStart);

                for (let i = 0; i < totalWords; i++) {
                    const btn = document.getElementById(`next-${i+1}`);
                    if (btn) {
                        btn.addEventListener('click', (e) => {
                            const idx = parseInt(e.target.getAttribute('data-index'), 10);
                            handleNext(idx);
                        });
                    }
                }

                for (let i = 0; i < totalWords; i++) {
                    const inp = document.getElementById(`answer-${i+1}`);
                    if (inp) {
                        inp.addEventListener('keypress', (e) => {
                            if (e.key === 'Enter') {
                                e.preventDefault();
                                const btn = document.getElementById(`next-${i+1}`);
                                if (btn && btn.style.display !== 'none') btn.click();
                            }
                        });
                    }
                }
            }

            window.addEventListener('resize', () => {
                if (canvas.style.display === 'block') {
                    canvas.width = rightFrame.clientWidth;
                    canvas.height = rightFrame.clientHeight;
                    initStars();
                }
            });

            const hourHand = document.getElementById('hour-hand');
            const minuteHand = document.getElementById('minute-hand');
            const secondHand = document.getElementById('second-hand');
            const clockOverlay = document.getElementById('clock-overlay');
            const question = document.getElementById('time-question');

            let isPaused = false;
            let pauseStartTime = 0;
            let totalPausedDuration = 0;
            const initialTotalSeconds = 10 * 3600 + 10 * 60 + 30;
            const clockStartTimestamp = Date.now() - initialTotalSeconds * 1000;

            function updateClock() {
                if (!isPaused) {
                    const now = Date.now();
                    const elapsedSeconds = (now - clockStartTimestamp - totalPausedDuration) / 1000;
                    const sec = elapsedSeconds % 60;
                    const min = (elapsedSeconds * 30.0 / 60) % 60;
                    const hour = (elapsedSeconds / 3600) % 12;
                    const secDeg = sec * 6;
                    const minDeg = min * 6;
                    const hourDeg = hour * 30;
                    if (secondHand) secondHand.style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
                    if (minuteHand) minuteHand.style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
                    if (hourHand) hourHand.style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;
                }
                requestAnimationFrame(updateClock);
            }

            function toggleClock() {
                if (isPaused) {
                    totalPausedDuration += (Date.now() - pauseStartTime);
                    isPaused = false;
                    if (question) question.classList.remove('show');
                } else {
                    pauseStartTime = Date.now();
                    isPaused = true;
                    if (question) question.classList.add('show');
                }
            }

            if (clockOverlay) {
                clockOverlay.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleClock();
                });
            }

            buildPages();
            attachEvents();
            stopStars();
            requestAnimationFrame(updateClock);
        })();
    </script>
